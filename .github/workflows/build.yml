name: Build Android APK & AAB
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STORE_PASSWORD: password123
      KEY_PASSWORD: password123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Generate Keystores & .env
        run: |
          cp .env.example .env 2>/dev/null || touch .env
          keytool -genkey -v -keystore my-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass password123 -keypass password123 -dname "CN=Carrom3D, OU=Dev, O=Royale, L=Patna, S=Bihar, C=IN"
          keytool -genkey -v -keystore debug.keystore -keyalg RSA -keysize 2048 -validity 10000 -alias androiddebugkey -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
      - name: Build APK & Play Store AAB
        run: gradle assembleDebug bundleRelease
      - name: Upload APK & AAB
        uses: actions/upload-artifact@v4
        with:
          name: Carrom-3D-Files
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
