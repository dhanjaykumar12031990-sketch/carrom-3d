name: Build Play Store Release
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STORE_PASSWORD: PrinceCarrom2026
      KEY_PASSWORD: PrinceCarrom2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Setup Permanent Keystore & .env
        run: |
          cp .env.example .env 2>/dev/null || touch .env
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
          keytool -genkey -v -keystore debug.keystore -keyalg RSA -keysize 2048 -validity 10000 -alias androiddebugkey -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
      - name: Build Signed Play Store AAB & APK
        run: gradle assembleDebug bundleRelease
      - name: Upload Play Store Bundle
        uses: actions/upload-artifact@v4
        with:
          name: PlayStore-Ready-Carrom3D
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/debug/*.apk
